<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چت هوش مصنوعی</title>
<style>
:root{--bg:#fff;--panel:#f5f5f6;--text:#1d1d1f;--muted:#74747c;--line:#e4e4e7;--accent:#3b6cf0;--user:#eceff8;--code:#f0f0f3}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--panel:#202020;--text:#ececec;--muted:#9b9ba3;--line:#303030;--accent:#6b94ff;--user:#262b38;--code:#0e0e0f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.8 Vazirmatn,Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.app{display:flex;height:100%}
.side{width:270px;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:10px;gap:8px;flex-shrink:0}
.side h2{font-size:14px;color:var(--muted);margin:8px 6px 2px;font-weight:500}
#list{flex:1;overflow:auto}
.item{display:flex;align-items:center;border-radius:8px;padding:2px 4px}
.item.on,.item:hover{background:var(--line)}
.item span{flex:1;padding:6px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.item b{color:var(--muted);font-weight:400;padding:4px 8px}
.btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
header .sp{flex:1}
#menu{display:none;font-size:20px;padding:4px 8px}
#mdl{direction:ltr;border:1px solid var(--line);border-radius:10px;padding:5px 12px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{flex:1;overflow:auto;padding:16px 12px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{padding:10px 14px;border-radius:14px;max-width:92%;overflow-wrap:anywhere}
.msg.user{background:var(--user);align-self:flex-start;white-space:pre-wrap}
.msg.bot{align-self:stretch;padding-inline:2px}
.msg pre{direction:ltr;text-align:left;background:var(--code);border-radius:10px;padding:10px 12px;overflow-x:auto;line-height:1.5;font-size:13px}
.msg code{direction:ltr;unicode-bidi:embed;background:var(--code);border-radius:5px;padding:1px 5px;font-size:13px}
.msg pre code{padding:0;background:none}
.msg li{margin-inline-start:1.2em}
.msg h3,.msg h4{margin:.6em 0 .2em}
.empty{text-align:center;color:var(--muted);margin-top:18vh}
.empty h1{color:var(--text);font-size:22px;margin:0 0 6px}
.bar{padding:8px 12px 12px}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 8px 6px 6px}
textarea{flex:1;background:none;border:0;outline:0;resize:none;max-height:160px;padding:8px;line-height:1.6}
#go{background:var(--accent);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;flex-shrink:0}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:440px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card input,.card textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;direction:ltr;text-align:left}
.card textarea{direction:rtl;text-align:right;min-height:70px}
.card label{color:var(--muted);font-size:13px}
.mi{direction:ltr;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.mi:hover,.mi.on{background:var(--panel)}
.mi small{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:760px){
 .side{position:fixed;inset:0 0 0 auto;z-index:10;transform:translateX(105%);transition:transform .2s;width:80%;max-width:300px;padding-top:calc(10px + env(safe-area-inset-top,0))}
 .side.on{transform:none}
 #menu{display:block}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="side">
  <button class="btn main" id="new">گفتگوی جدید</button>
  <h2>گفتگوها</h2>
  <div id="list"></div>
  <button class="btn" id="set">تنظیمات</button>
 </aside>
 <main>
  <header>
   <button id="menu" aria-label="منو">☰</button>
   <button id="mdl">انتخاب مدل</button>
   <span class="sp"></span>
  </header>
  <div id="chat"><div class="wrap" id="msgs"></div></div>
  <div class="bar"><div class="box">
   <textarea id="inp" rows="1" dir="auto" placeholder="پیام خود را بنویسید"></textarea>
   <button id="go" aria-label="ارسال">↑</button>
  </div></div>
 </main>
</div>

<div class="modal" id="m-set"><div class="card">
 <label>کلید API اوپن‌روتر (از openrouter.ai/keys)</label>
 <input id="key" type="password" placeholder="sk-or-..." autocomplete="off">
 <label>دستور سیستمی (اختیاری)</label>
 <textarea id="sys"></textarea>
 <button class="btn main" id="save">ذخیره</button>
 <button class="btn" id="clear">پاک کردن همهٔ گفتگوها</button>
 <label>کلید و گفتگوها فقط روی همین دستگاه ذخیره می‌شوند.</label>
</div></div>

<div class="modal" id="m-mdl"><div class="card">
 <input id="q" placeholder="جستجوی مدل، مثلاً deepseek">
 <div id="ml"></div>
</div></div>

<script>
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const PRESETS=['meta-llama/llama-3.3-70b-instruct:free','deepseek/deepseek-chat','google/gemini-2.5-flash','anthropic/claude-sonnet-4.5','openai/gpt-4o-mini'];
let chats=st.get('chats',[]),cur=null,key=st.get('key',''),sys=st.get('sys',''),model=st.get('model',PRESETS[0]),ctrl=null,all=[];

const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(t){
 const b=[];
 t=esc(t).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{b.push('<pre><code>'+c+'</code></pre>');return '\u0000'+(b.length-1)+'\u0000'});
 t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
  .replace(/^#{1,2} (.*)$/gm,'<h3>$1</h3>').replace(/^#{3,} (.*)$/gm,'<h4>$1</h4>')
  .replace(/^[-*] (.*)$/gm,'<li>$1</li>').replace(/\n/g,'<br>').replace(/(<\/(li|h3|h4)>)<br>/g,'$1');
 return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>b[i]);
}
const save=()=>st.set('chats',chats);
function newChat(){cur={id:Date.now(),title:'گفتگوی جدید',messages:[]};chats.unshift(cur);renderList();renderChat();$('#side').classList.remove('on')}
function renderList(){
 const l=$('#list');l.innerHTML='';
 chats.forEach(c=>{
  const d=document.createElement('div');d.className='item'+(c===cur?' on':'');
  const s=document.createElement('span');s.textContent=c.title;s.onclick=()=>{cur=c;renderList();renderChat();$('#side').classList.remove('on')};
  const x=document.createElement('b');x.textContent='×';x.setAttribute('role','button');x.onclick=()=>{chats=chats.filter(k=>k!==c);if(cur===c)cur=null;save();renderList();renderChat()};
  d.append(s,x);l.append(d);
 });
}
function renderChat(){
 const w=$('#msgs');w.innerHTML='';
 if(!cur||!cur.messages.length){w.innerHTML='<div class="empty"><h1>چطور کمکت کنم؟</h1>اول از تنظیمات کلید API اوپن‌روتر را وارد کن.</div>';return}
 cur.messages.forEach(m=>{const d=document.createElement('div');d.className='msg '+(m.role==='user'?'user':'bot');d.dir='auto';
  if(m.role==='user')d.textContent=m.content;else d.innerHTML=md(m.content);w.append(d)});
 down();
}
const down=()=>{const c=$('#chat');c.scrollTop=c.scrollHeight};
function busy(b){$('#go').textContent=b?'■':'↑'}
function grow(){const t=$('#inp');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}

async function send(){
 if(ctrl){ctrl.abort();return}
 const inp=$('#inp'),text=inp.value.trim();if(!text)return;
 if(!key){openSet();return}
 if(!cur)newChat();
 if(!cur.messages.length)cur.title=text.slice(0,40);
 cur.messages.push({role:'user',content:text});
 const m={role:'assistant',content:''};cur.messages.push(m);
 inp.value='';grow();renderChat();renderList();
 const el=$('#msgs').lastChild;
 ctrl=new AbortController();busy(true);
 try{
  const msgs=[...(sys?[{role:'system',content:sys}]:[]),...cur.messages.slice(0,-1)];
  const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',signal:ctrl.signal,
   headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','X-Title':'My Chat'},
   body:JSON.stringify({model,messages:msgs,stream:true})});
  if(!r.ok)throw new Error(r.status+' — '+(await r.text()).slice(0,300));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){
   const {done,value}=await rd.read();if(done)break;
   buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
   for(const l of lines){
    if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d==='[DONE]')continue;
    let j;try{j=JSON.parse(d)}catch(e){continue}
    if(j.error)throw new Error(j.error.message||'خطای ناشناخته');
    const c=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
    if(c){m.content+=c;el.innerHTML=md(m.content);down()}
   }
  }
 }catch(e){
  if(e.name!=='AbortError')m.content+=(m.content?'\n\n':'')+'خطا: '+e.message;
 }finally{
  ctrl=null;busy(false);
  if(!m.content)cur.messages.pop();
  save();renderChat();
 }
}

function openSet(){$('#key').value=key;$('#sys').value=sys;$('#m-set').classList.add('on')}
function renderModels(){
 const q=$('#q').value.trim().toLowerCase(),ml=$('#ml');ml.innerHTML='';
 const ids=new Set(PRESETS);all.forEach(x=>ids.add(x.id));
 let arr=[...ids].filter(id=>id.toLowerCase().includes(q));
 if(!q)arr=[...PRESETS,...arr.filter(i=>!PRESETS.includes(i))];
 if(q&&!arr.length)arr=[q];
 arr.slice(0,60).forEach(id=>{
  const d=document.createElement('div');d.className='mi'+(id===model?' on':'');
  d.innerHTML='<span>'+esc(id)+'</span>'+(id.endsWith(':free')?'<small>free</small>':'');
  d.onclick=()=>{model=id;st.set('model',id);$('#mdl').textContent=id;$('#m-mdl').classList.remove('on')};
  ml.append(d);
 });
}
async function loadModels(){
 try{const r=await fetch('https://openrouter.ai/api/v1/models');const j=await r.json();all=j.data||[];renderModels()}catch(e){}
}

$('#go').onclick=send;
$('#inp').addEventListener('input',grow);
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(min-width:761px)').matches){e.preventDefault();send()}});
$('#new').onclick=newChat;
$('#set').onclick=openSet;
$('#menu').onclick=()=>$('#side').classList.toggle('on');
$('#mdl').onclick=()=>{$('#q').value='';renderModels();$('#m-mdl').classList.add('on')};
$('#q').oninput=renderModels;
$('#save').onclick=()=>{key=$('#key').value.trim();sys=$('#sys').value;st.set('key',key);st.set('sys',sys);$('#m-set').classList.remove('on')};
$('#clear').onclick=()=>{if(confirm('همهٔ گفتگوها پاک شوند؟')){chats=[];cur=null;save();renderList();renderChat()}};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('on')}));
$('#mdl').textContent=model;
renderList();renderChat();loadModels();
</script>
</body>
</html>
