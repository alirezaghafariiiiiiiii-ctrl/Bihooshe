<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آریا</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#14323a">
<style>
:root{
  --bg:#f2f5f4; --panel:#ffffff; --ink:#14232b; --muted:#5d6f76; --line:#d5dedc;
  --me:#14323a; --me-ink:#f2f5f4; --bot:#e3ecea; --accent:#1f8a8a; --warn:#b4531f;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1a1f; --panel:#15262c; --ink:#e6eeec; --muted:#8fa4a9; --line:#26393f;
  --me:#1f8a8a; --me-ink:#ffffff; --bot:#1a2e34; --accent:#4cc3c0; --warn:#e08a54;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Vazirmatn,Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1}
#status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
#status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
#status.ok i{background:var(--accent)} #status.off i{background:var(--warn)}
button{font:inherit;color:inherit;cursor:pointer}
.ic{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.ic:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-start;background:var(--me);color:var(--me-ink);border-end-start-radius:4px}
.msg.assistant{align-self:flex-end;background:var(--bot);border-end-end-radius:4px}
.msg.err{align-self:center;background:none;color:var(--warn);font-size:14px}
.msg small{display:block;margin-top:6px}
.msg small button{background:none;border:0;color:var(--muted);font-size:12px;padding:0}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:280px;line-height:1.9}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src a{font-size:12px;color:var(--accent);border:1px solid var(--line);border-radius:8px;padding:2px 8px;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
#webBtn{border:1px solid var(--line);background:none;border-radius:12px;padding:0 12px;color:var(--muted)}
#webBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5}
dialog{width:min(92vw,460px);max-height:88vh;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 12px;font-size:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,.sel{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
input{direction:ltr;text-align:left}
.row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.hint{font-size:12px;color:var(--muted);line-height:1.8;margin:6px 0 0}
#noteList{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
#noteList li{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.8}
#noteList li span{flex:1;white-space:pre-wrap;word-break:break-word}
#noteList button{background:none;border:0;color:var(--warn);font-size:13px}
@media (prefers-reduced-motion:no-preference){#chat{scroll-behavior:smooth}}
</style>
</head>
<body>
<header>
  <h1>آریا</h1>
  <span id="status"><i></i><span id="statusText">...</span></span>
  <button class="ic" id="notesBtn">حافظه</button>
  <button class="ic" id="setBtn">تنظیمات</button>
</header>

<main id="chat" aria-live="polite"></main>

<form id="form">
  <button type="button" id="webBtn" title="جستجوی وب" aria-pressed="true">وب</button>
  <textarea id="input" rows="1" dir="auto" placeholder="پیام بنویس..."></textarea>
  <button id="send" type="submit">ارسال</button>
</form>

<dialog id="setDlg">
  <h2>تنظیمات</h2>
  <label for="orKey">کلید OpenRouter</label>
  <input id="orKey" type="password" autocomplete="off" placeholder="sk-or-...">
  <label for="model">نام مدل</label>
  <input id="model" placeholder="openai/gpt-4o-mini">
  <label for="ghToken">توکن گیت‌هاب (فقط برای ریپوی حافظه)</label>
  <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_...">
  <label for="ghRepo">ریپوی حافظه (کاربر/نام‌ریپو)</label>
  <input id="ghRepo" placeholder="username/arya-memory">
  <p class="hint">کلیدها فقط توی مرورگر همین گوشی ذخیره می‌شن و هیچ‌جای کد یا ریپو نمی‌رن.</p>
  <label for="tavKey">کلید Tavily برای جستجوی وب (اختیاری، رایگان)</label>
  <input id="tavKey" type="password" autocomplete="off" placeholder="tvly-...">
  <p class="hint">از tavily.com رایگان و بدون کارت بانکی بگیر (ماهی ۱۰۰۰ اعتبار). بدون کلید، فقط ویکی‌پدیا جستجو می‌شه.</p>
  <label for="sys">شخصیت و دستور اصلی آریا</label>
  <textarea id="sys" rows="3" dir="auto"></textarea>
  <div class="row">
    <button class="btn" id="saveSet">ذخیره</button>
    <button class="btn alt" id="syncNow">همگام‌سازی الان</button>
    <button class="btn alt" id="closeSet">بستن</button>
  </div>
</dialog>

<dialog id="noteDlg">
  <h2>حافظه</h2>
  <p class="hint">آریا این یادداشت‌ها رو توی هر گفتگو می‌بینه. می‌تونی توی چت هم بنویسی «/حافظه متن».</p>
  <textarea id="noteInput" rows="2" dir="auto" placeholder="چیزی که آریا باید یادش بمونه..."></textarea>
  <div class="row">
    <button class="btn" id="addNote">افزودن</button>
    <button class="btn alt" id="clearChat">پاک کردن گفتگو</button>
    <button class="btn alt" id="closeNote">بستن</button>
  </div>
  <ul id="noteList"></ul>
</dialog>

<script>
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const DEFAULT_SYS = 'تو آریا هستی، یک دستیار هوشمند فارسی‌زبان. دقیق، صمیمی و کوتاه جواب بده.';
let cfg = Object.assign({ orKey: '', model: 'openai/gpt-4o-mini', ghToken: '', ghRepo: '', sys: DEFAULT_SYS, web: true, tavily: '' }, store.get('cfg', {}));
let data = store.get('data', { notes: [], messages: [] });
let dirty = store.get('dirty', false);
let sha = store.get('sha', null);
let busy = false;

const FILE = 'memory.json';
const toB64 = s => { let b = ''; new TextEncoder().encode(s).forEach(c => b += String.fromCharCode(c)); return btoa(b); };
const fromB64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));

function persist() { store.set('data', data); store.set('dirty', dirty); store.set('sha', sha); }
function setStatus(kind, text) {
  $('#status').className = kind; $('#statusText').textContent = text;
}
function refreshStatus() {
  if (!navigator.onLine) return setStatus('off', 'آفلاین');
  if (!cfg.ghToken || !cfg.ghRepo) return setStatus('', 'فقط روی گوشی');
  setStatus(dirty ? 'off' : 'ok', dirty ? 'منتظر همگام‌سازی' : 'همگام');
}

/* ---------- GitHub memory ---------- */
const ghUrl = () => `https://api.github.com/repos/${cfg.ghRepo}/contents/${FILE}`;
const ghHeaders = () => ({ Authorization: 'Bearer ' + cfg.ghToken, Accept: 'application/vnd.github+json' });
const mergeById = (a, b) => {
  const m = new Map(); [...a, ...b].forEach(x => m.set(x.id, x));
  return [...m.values()].sort((x, y) => (x.t || 0) - (y.t || 0));
};

async function pull() {
  const r = await fetch(ghUrl(), { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) { sha = null; return; }
  if (!r.ok) throw new Error('GitHub ' + r.status);
  const j = await r.json();
  sha = j.sha;
  const remote = JSON.parse(fromB64(j.content));
  if (dirty) {
    data = { notes: mergeById(data.notes, remote.notes || []), messages: mergeById(data.messages, remote.messages || []) };
  } else {
    data = { notes: remote.notes || [], messages: remote.messages || [] };
  }
}

async function push(retry = true) {
  const body = { message: 'update memory', content: toB64(JSON.stringify(data, null, 1)) };
  if (sha) body.sha = sha;
  const r = await fetch(ghUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) {
    if (retry) { await pull(); return push(false); }
  }
  if (!r.ok) throw new Error('GitHub ' + r.status);
  sha = (await r.json()).content.sha;
  dirty = false;
}

let syncing = false;
async function sync() {
  if (syncing || !navigator.onLine || !cfg.ghToken || !cfg.ghRepo) return refreshStatus();
  syncing = true; setStatus('', 'در حال همگام‌سازی...');
  try {
    await pull();
    if (dirty) await push();
    persist(); render(); renderNotes();
  } catch (e) {
    setStatus('off', 'خطا در همگام‌سازی');
    console.error(e);
  } finally { syncing = false; refreshStatus(); }
}
let syncTimer;
const scheduleSync = () => { clearTimeout(syncTimer); syncTimer = setTimeout(async () => {
  if (!navigator.onLine || !cfg.ghToken || !cfg.ghRepo) return refreshStatus();
  try { await pull(); await push(); persist(); } catch (e) { console.error(e); }
  refreshStatus();
}, 2500); };
function touch() { dirty = true; persist(); refreshStatus(); scheduleSync(); }

/* ---------- Chat ---------- */
function render() {
  const box = $('#chat'); box.textContent = '';
  if (!data.messages.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'سلام! من آریام. هر چی می‌خوای بپرس. برای اینکه چیزی رو همیشه یادم بمونه بنویس «/حافظه ...».';
    box.append(e); return;
  }
  data.messages.slice(-80).forEach(m => {
    const d = document.createElement('div'); d.className = 'msg ' + m.role; d.dir = 'auto';
    d.textContent = m.content;
    if (m.role === 'assistant' && m.sources && m.sources.length) {
      const w = document.createElement('div'); w.className = 'src';
      m.sources.forEach(x => {
        if (!/^https?:\/\//i.test(x.url)) return;
        const a = document.createElement('a');
        a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.textContent = x.title.slice(0, 60); w.append(a);
      });
      d.append(w);
    }
    if (m.role === 'assistant') {
      const s = document.createElement('small'), b = document.createElement('button');
      b.textContent = 'ذخیره در حافظه';
      b.onclick = () => { addNote(m.content.slice(0, 400)); b.textContent = 'ذخیره شد'; b.disabled = true; };
      s.append(b); d.append(s);
    }
    box.append(d);
  });
  box.scrollTop = box.scrollHeight;
}
function showErr(t) {
  const d = document.createElement('div'); d.className = 'msg err'; d.textContent = t;
  $('#chat').append(d); $('#chat').scrollTop = 1e9;
}

function buildMessages(ctx) {
  let sys = (cfg.sys || DEFAULT_SYS) + '\n\nتاریخ امروز: ' + new Date().toLocaleDateString('fa-IR') + ' (' + new Date().toISOString().slice(0, 10) + ').';
  if (ctx) sys += ctx;
  if (data.notes.length) sys += '\n\nیادداشت‌های حافظه درباره کاربر:\n' + data.notes.map(n => '- ' + n.text).join('\n');
  const hist = data.messages.slice(-20).map(m => ({ role: m.role, content: m.content }));
  return [{ role: 'system', content: sys }, ...hist];
}

let webNote = '';
const withTimeout = (url, opt = {}, ms = 9000) => {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  return fetch(url, { ...opt, signal: c.signal }).finally(() => clearTimeout(t));
};
async function tavilySearch(q) {
  const r = await withTimeout('https://api.tavily.com/search', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.tavily },
    body: JSON.stringify({ query: q, max_results: 5, search_depth: 'basic' })
  });
  if (!r.ok) throw new Error('tavily ' + r.status);
  const j = await r.json();
  return (j.results || []).map(x => ({ title: x.title || x.url, url: x.url, content: (x.content || '').slice(0, 500) }));
}
async function wikiSearch(q) {
  const one = async lang => {
    const u = `https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts%7Cinfo&inprop=url&exintro=1&explaintext=1&exchars=500&format=json&origin=*`;
    const r = await withTimeout(u); if (!r.ok) return [];
    const j = await r.json();
    return Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index)
      .map(p => ({ title: p.title, url: p.fullurl, content: (p.extract || '').slice(0, 500) }));
  };
  const [fa, en] = await Promise.all([one('fa').catch(() => []), one('en').catch(() => [])]);
  return [...fa, ...en].filter(x => x.url && x.content).slice(0, 4);
}
async function webSearch(q) {
  webNote = '';
  if (!navigator.onLine) return [];
  q = q.slice(0, 200);
  if (cfg.tavily) {
    try { const r = await tavilySearch(q); if (r.length) return r; }
    catch (e) { console.error(e); webNote = 'جستجوی Tavily کار نکرد (کلید یا سهمیه رو چک کن)، از ویکی‌پدیا استفاده شد.'; }
  }
  try { return await wikiSearch(q); } catch (e) { console.error(e); return []; }
}

async function ask(text) {
  data.messages.push({ id: uid(), role: 'user', content: text, t: Date.now() });
  touch(); render();
  if (!navigator.onLine) return showErr('اینترنت نداری. پیامت ذخیره شد، ولی جواب هوشمند فقط آنلاین کار می‌کنه.');
  if (!cfg.orKey) return showErr('اول از «تنظیمات» کلید OpenRouter رو وارد کن.');
  busy = true; $('#send').disabled = true;
  try {
    let found = [];
    if (cfg.web) { setStatus('', 'در حال جستجوی وب...'); found = await webSearch(text); refreshStatus(); }
    const ctx = found.length
      ? '\n\nنتایج جستجوی وب برای آخرین پیام کاربر (فقط اگه به سؤال مربوطن ازشون استفاده کن و منبع رو بگو):\n' +
        found.map((x, i) => `[${i + 1}] ${x.title} - ${x.url}\n${x.content}`).join('\n\n')
      : '';
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + cfg.orKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: cfg.model || 'openai/gpt-4o-mini', messages: buildMessages(ctx) })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error?.message || ('خطا ' + r.status));
    const out = j.choices?.[0]?.message?.content || '(جواب خالی بود)';
    data.messages.push({ id: uid(), role: 'assistant', content: out, sources: found.map(x => ({ url: x.url, title: x.title })), t: Date.now() });
    touch(); render();
    if (webNote) showErr(webNote);
  } catch (e) {
    showErr('جواب نیومد: ' + e.message);
  } finally { busy = false; $('#send').disabled = false; }
}

function addNote(text) {
  text = text.trim(); if (!text) return;
  data.notes.push({ id: uid(), text, t: Date.now() });
  touch(); renderNotes();
}
function renderNotes() {
  const ul = $('#noteList'); ul.textContent = '';
  data.notes.slice().reverse().forEach(n => {
    const li = document.createElement('li'), sp = document.createElement('span'), b = document.createElement('button');
    sp.textContent = n.text; sp.dir = 'auto'; b.textContent = 'حذف';
    b.onclick = () => { data.notes = data.notes.filter(x => x.id !== n.id); touch(); renderNotes(); };
    li.append(sp, b); ul.append(li);
  });
}

/* ---------- UI wiring ---------- */
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#input').value.trim(); if (!t || busy) return;
  $('#input').value = ''; $('#input').style.height = 'auto';
  if (t.startsWith('/حافظه')) { addNote(t.replace('/حافظه', '')); return; }
  ask(t);
});
$('#input').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; });

$('#setBtn').onclick = () => {
  $('#orKey').value = cfg.orKey; $('#model').value = cfg.model; $('#ghToken').value = cfg.ghToken;
  $('#ghRepo').value = cfg.ghRepo; $('#sys').value = cfg.sys; $('#tavKey').value = cfg.tavily || ''; $('#setDlg').showModal();
};
$('#saveSet').onclick = () => {
  cfg = { orKey: $('#orKey').value.trim(), model: $('#model').value.trim(), ghToken: $('#ghToken').value.trim(),
          ghRepo: $('#ghRepo').value.trim(), sys: $('#sys').value.trim() || DEFAULT_SYS, web: cfg.web, tavily: $('#tavKey').value.trim() };
  store.set('cfg', cfg); $('#setDlg').close(); sync();
};
$('#syncNow').onclick = () => { cfg.ghToken = $('#ghToken').value.trim(); cfg.ghRepo = $('#ghRepo').value.trim(); store.set('cfg', cfg); dirty = true; sync(); };
$('#closeSet').onclick = () => $('#setDlg').close();
$('#notesBtn').onclick = () => { renderNotes(); $('#noteDlg').showModal(); };
$('#closeNote').onclick = () => $('#noteDlg').close();
$('#addNote').onclick = () => { addNote($('#noteInput').value); $('#noteInput').value = ''; };
$('#clearChat').onclick = () => { if (confirm('گفتگو پاک بشه؟ یادداشت‌های حافظه می‌مونن.')) { data.messages = []; touch(); render(); } };

window.addEventListener('online', () => { refreshStatus(); sync(); });
window.addEventListener('offline', refreshStatus);

const webBtn = $('#webBtn');
const paintWeb = () => { webBtn.classList.toggle('on', !!cfg.web); webBtn.setAttribute('aria-pressed', String(!!cfg.web)); };
webBtn.onclick = () => { cfg.web = !cfg.web; store.set('cfg', cfg); paintWeb(); };
paintWeb();

render(); renderNotes(); refreshStatus(); sync();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
